<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <title>KPI Master - Histórico do Cartão</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    :root {
      --bg-body: transparent;
      --bg-box: #ffffff;
      --border-box: #dfe1e6;
      --title-color: #172b4d;
      --desc-color: #5e6c84;
      --accent-blue: #0065ff;
      --badge-bg: #e6fcff;
      --badge-text: #006644;
      --btn-bg: #091e420f;
      --btn-text: #172b4d;
      --btn-hover: #091e4224;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-body: transparent;
        --bg-box: #22272b;
        --border-box: #38414a;
        --title-color: #b6c2cf;
        --desc-color: #9fadbc;
        --accent-blue: #38bdf8;
        --badge-bg: #1c3326;
        --badge-text: #4ade80;
        --btn-bg: #2c333f;
        --btn-text: #b6c2cf;
        --btn-hover: #3a4454;
      }
    }

    * { box-sizing: border-box; }

    body {
      background: var(--bg-body);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 4px 0px;
    }

    .card-history-container {
      background: var(--bg-box);
      border: 1px solid var(--border-box);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .title-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-icon {
      font-size: 16px;
    }

    .title-text {
      font-size: 13px;
      font-weight: 700;
      color: var(--title-color);
    }

    .cycle-badge {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent-blue);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .timeline-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .timeline-step {
      flex: 1;
      background: var(--btn-bg);
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .timeline-step.active {
      border: 1px solid var(--accent-blue);
      background: rgba(56, 189, 248, 0.08);
    }

    .step-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--desc-color);
    }

    .step-val {
      font-size: 12px;
      font-weight: 700;
      color: var(--title-color);
    }

    .footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 2px;
    }

    .btn-link {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-link:hover {
      background: var(--btn-hover);
    }
  </style>
</head>
<body>

  <div class="card-history-container">
    <div class="header-row">
      <div class="title-box">
        <span class="title-icon">⏱️</span>
        <span class="title-text" id="lbl-title">Histórico de Passagem da Lead</span>
      </div>
      <div class="cycle-badge" id="lbl-cycle">Ciclo Total: Calculando...</div>
    </div>

    <div class="timeline-bar">
      <div class="timeline-step">
        <span class="step-label" id="lbl-created-label">Data de Entrada</span>
        <span class="step-val" id="lbl-created-val">--</span>
      </div>
      <div class="timeline-step active">
        <span class="step-label" id="lbl-list-label">Coluna Atual</span>
        <span class="step-val" id="lbl-list-val">--</span>
      </div>
      <div class="timeline-step">
        <span class="step-label" id="lbl-age-label">Idade da Lead</span>
        <span class="step-val" id="lbl-age-val">--</span>
      </div>
    </div>

    <div class="footer-row">
      <a id="btn-dashboard" class="btn-link" href="#" target="_blank">
        📈 Ver KPIs Completos do Quadro →
      </a>
    </div>
  </div>

  <script type="module">
    var KEY = import.meta.env.VITE_TRELLO_API_KEY;
    var NAME = 'KPI Master';
    var SITE = 'https://kpismaster.vercel.app';

    var t = TrelloPowerUp.iframe({ appKey: KEY, appName: NAME });

    var locale = t.locale || 'en';
    var isPt = locale.startsWith('pt');

    var translations = {
      pt: {
        title: 'Histórico de Passagem da Lead',
        createdLabel: 'Data de Entrada',
        listLabel: 'Coluna Atual',
        ageLabel: 'Idade da Lead',
        today: 'Hoje',
        yesterday: 'Ontem',
        daysAgo: '{days} dias atrás',
        cycleText: 'Ciclo Total: {days} dias',
        btnText: '📈 Ver KPIs Completos do Quadro →'
      },
      en: {
        title: 'Lead Stage & Speed History',
        createdLabel: 'Entry Date',
        listLabel: 'Current List',
        ageLabel: 'Lead Age',
        today: 'Today',
        yesterday: 'Yesterday',
        daysAgo: '{days} days ago',
        cycleText: 'Total Cycle: {days} days',
        btnText: '📈 View Full Board KPIs →'
      }
    };

    var tDict = isPt ? translations.pt : translations.en;

    document.getElementById('lbl-title').textContent = tDict.title;
    document.getElementById('lbl-created-label').textContent = tDict.createdLabel;
    document.getElementById('lbl-list-label').textContent = tDict.listLabel;
    document.getElementById('lbl-age-label').textContent = tDict.ageLabel;
    document.getElementById('btn-dashboard').textContent = tDict.btnText;

    t.render(function () {
      t.sizeTo(document.body).catch(function () { });

      Promise.all([
        t.card('id', 'name', 'idList'),
        t.list('id', 'name'),
        t.board('id')
      ]).then(function (res) {
        var card = res[0];
        var currentList = res[1];
        var board = res[2];

        if (card && card.id) {
          var timestamp = parseInt(card.id.substring(0, 8), 16);
          var dateCreated = new Date(timestamp * 1000);
          var diffMs = Date.now() - dateCreated.getTime();
          var diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

          var dateStr = dateCreated.toLocaleDateString(isPt ? 'pt-PT' : 'en-US', {
            month: 'short',
            day: 'numeric'
          });

          document.getElementById('lbl-created-val').textContent = dateStr;

          if (currentList && currentList.name) {
            document.getElementById('lbl-list-val').textContent = currentList.name;
          } else {
            document.getElementById('lbl-list-val').textContent = 'Ativa';
          }

          var ageText = diffDays === 0 ? tDict.today : (diffDays === 1 ? tDict.yesterday : diffDays + ' dias');
          document.getElementById('lbl-age-val').textContent = ageText;
          document.getElementById('lbl-cycle').textContent = tDict.cycleText.replace('{days}', diffDays);
        }

        if (board && board.id) {
          var boardId = board.id;
          var context = t.getContext();
          var memberId = context ? context.member : null;
          var defaultHref = SITE + '#board=' + boardId + '&role=vendedor';
          document.getElementById('btn-dashboard').href = defaultHref;

          t.getRestApi().isAuthorized().then(function(isAuth) {
            if (isAuth) {
              return t.getRestApi().getToken();
            }
            throw new Error('Not authorized');
          }).then(function(token) {
            if (token && memberId) {
              return fetch('https://api.trello.com/1/boards/' + boardId + '/memberships?key=' + KEY + '&token=' + token)
                .then(function(res) { return res.json(); })
                .then(function(memberships) {
                  if (Array.isArray(memberships)) {
                    var myMembership = memberships.find(function(m) { return m.idMember === memberId; });
                    var role = (myMembership && myMembership.memberType === 'admin') ? 'gestor' : 'vendedor';
                    document.getElementById('btn-dashboard').href = SITE + '#board=' + boardId + '&role=' + role + '&token=' + token;
                  }
                });
            }
          }).catch(function(err) {});
        } else {
          document.getElementById('btn-dashboard').href = SITE;
        }

        document.getElementById('btn-dashboard').addEventListener('click', function(e) {
          e.preventDefault();
          t.board('id').then(function(board) {
            if (!board || !board.id) {
              window.open(SITE, '_blank');
              return;
            }
            var boardId = board.id;
            var context = t.getContext();
            var memberId = context ? context.member : null;

            t.getRestApi().isAuthorized().then(function(isAuth) {
              if (isAuth) return t.getRestApi().getToken();
              throw new Error('Not authorized');
            }).then(function(token) {
              if (token && memberId) {
                return fetch('https://api.trello.com/1/boards/' + boardId + '/memberships?key=' + KEY + '&token=' + token)
                  .then(function(res) { return res.json(); })
                  .then(function(memberships) {
                    var role = 'vendedor';
                    if (Array.isArray(memberships)) {
                      var myMembership = memberships.find(function(m) { return m.idMember === memberId; });
                      role = (myMembership && myMembership.memberType === 'admin') ? 'gestor' : 'vendedor';
                    }
                    window.open(SITE + '#board=' + boardId + '&role=' + role + '&token=' + token, '_blank');
                  });
              } else {
                window.open(SITE + '#board=' + boardId + '&role=vendedor' + (token ? '&token=' + token : ''), '_blank');
              }
            }).catch(function() {
              window.open(SITE + '#board=' + boardId + '&role=vendedor', '_blank');
            });
          }).catch(function() {
            window.open(SITE, '_blank');
          });
        });
      });
    });
  </script>

</body>
</html>
