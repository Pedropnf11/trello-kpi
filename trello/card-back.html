<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <title>KPI Master - Histórico do Cartão</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    :root {
      --bg-body: transparent;
      --bg-box: #ffffff;
      --border-box: #dfe1e6;
      --title-color: #172b4d;
      --desc-color: #5e6c84;
      --accent-blue: #0065ff;
      --accent-green: #00875a;
      --btn-bg: #091e420f;
      --btn-text: #172b4d;
      --btn-hover: #091e4224;
      --item-bg: #f4f5f7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-body: transparent;
        --bg-box: #22272b;
        --border-box: #38414a;
        --title-color: #b6c2cf;
        --desc-color: #9fadbc;
        --accent-blue: #38bdf8;
        --accent-green: #4ade80;
        --btn-bg: #2c333f;
        --btn-text: #b6c2cf;
        --btn-hover: #3a4454;
        --item-bg: #1c2126;
      }
    }

    * { box-sizing: border-box; }

    body {
      background: var(--bg-body);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 4px 0px;
    }

    .card-history-container {
      background: var(--bg-box);
      border: 1px solid var(--border-box);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .title-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-icon { font-size: 16px; }

    .title-text {
      font-size: 13px;
      font-weight: 700;
      color: var(--title-color);
    }

    .cycle-badge {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent-blue);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .timeline-bar {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .timeline-step {
      flex: 1;
      background: var(--btn-bg);
      border-radius: 6px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .timeline-step.active {
      border: 1px solid var(--accent-blue);
      background: rgba(56, 189, 248, 0.08);
    }

    .step-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--desc-color);
    }

    .step-val {
      font-size: 12px;
      font-weight: 700;
      color: var(--title-color);
    }

    /* ── Activity Tracker ── */
    .activity-section {
      background: rgba(59, 130, 246, 0.04);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .activity-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .activity-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--title-color);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .activity-last-update {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-blue);
      background: rgba(59, 130, 246, 0.1);
      padding: 2px 8px;
      border-radius: 9999px;
    }

    .activity-counters-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .counter-card {
      background: var(--bg-box);
      border: 1px solid var(--border-box);
      border-radius: 6px;
      padding: 7px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .counter-number {
      font-size: 18px;
      font-weight: 800;
      color: var(--title-color);
    }

    .counter-label {
      font-size: 9.5px;
      color: var(--desc-color);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      line-height: 1.25;
      text-align: center;
    }

    .activity-actions-row {
      display: flex;
      gap: 8px;
    }

    .btn-activity {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--bg-box);
      border: 1px solid var(--border-box);
      color: var(--title-color);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-activity:hover {
      background: var(--accent-blue);
      color: #ffffff;
      border-color: var(--accent-blue);
    }

    .btn-activity:active {
      transform: scale(0.97);
    }

    /* ── Streamed Timeline History Section ── */
    .stream-section {
      border-top: 1px dashed var(--border-box);
      padding-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      max-height: 150px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--desc-color) transparent;
      padding-right: 5px;
    }

    .stream-section::-webkit-scrollbar { width: 6px; }
    .stream-section::-webkit-scrollbar-thumb { background: var(--desc-color); border-radius: 6px; }
    .stream-section::-webkit-scrollbar-track { background: transparent; }

    /* 🔒 Lock overlay for stream section */
    .stream-locked-overlay {
      background: linear-gradient(135deg, rgba(245,158,11,0.07), rgba(59,130,246,0.05));
      border: 1px dashed rgba(245,158,11,0.45);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    .stream-locked-overlay:hover {
      background: rgba(245,158,11,0.14);
      border-color: #f59e0b;
    }

    .stream-locked-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stream-locked-icon {
      font-size: 20px;
      line-height: 1;
      animation: lock-pulse 2s ease-in-out infinite;
    }

    @keyframes lock-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.18); opacity: 0.8; }
    }

    .stream-locked-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stream-locked-title {
      font-size: 12px;
      font-weight: 800;
      color: #f59e0b;
    }

    .stream-locked-sub {
      font-size: 10.5px;
      color: var(--desc-color);
    }

    .stream-locked-badge {
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      padding: 4px 10px;
      border-radius: 9999px;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(245,158,11,0.35);
    }

    .stream-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--desc-color);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stream-timeline {
      display: flex;
      flex-direction: column;
      position: relative;
      padding-left: 18px;
    }

    .stream-timeline::before {
      content: '';
      position: absolute;
      left: 6px;
      top: 6px;
      bottom: 6px;
      width: 2px;
      background: var(--border-box);
    }

    .stream-node {
      position: relative;
      padding-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .stream-node:last-child { padding-bottom: 0; }

    .stream-dot {
      position: absolute;
      left: -18px;
      top: 3px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--desc-color);
      border: 2px solid var(--bg-box);
    }

    .stream-node.latest .stream-dot {
      background: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
    }

    .stream-node.first .stream-dot { background: var(--accent-green); }

    .stream-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .stream-list-name {
      font-size: 12px;
      font-weight: 700;
      color: var(--title-color);
    }

    .stream-date {
      font-size: 11px;
      color: var(--desc-color);
    }

    .stream-stay {
      font-size: 11px;
      color: var(--desc-color);
      line-height: 1.4;
    }

    .stream-stay-highlight {
      font-weight: 700;
      color: var(--accent-blue);
    }

    .auth-banner {
      background: rgba(56, 189, 248, 0.08);
      border: 1px dashed rgba(56, 189, 248, 0.3);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 11px;
      color: var(--title-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .auth-btn {
      background: var(--accent-blue);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 10.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 2px;
    }

    .btn-link {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-link:hover { background: var(--btn-hover); }
  </style>
</head>
<body>

  <div class="card-history-container">
    <div class="header-row">
      <div class="title-box">
        <span class="title-icon">⏱️</span>
        <span class="title-text" id="lbl-title">Histórico de Passagem da Lead</span>
      </div>
      <div class="cycle-badge" id="lbl-cycle">Ciclo Total: Calculando...</div>
    </div>

    <div class="timeline-bar">
      <div class="timeline-step">
        <span class="step-label" id="lbl-created-label">Data de Entrada</span>
        <span class="step-val" id="lbl-created-val">--</span>
      </div>
      <div class="timeline-step active">
        <span class="step-label" id="lbl-list-label">Coluna Atual</span>
        <span class="step-val" id="lbl-list-val">--</span>
      </div>
      <div class="timeline-step">
        <span class="step-label" id="lbl-age-label">Idade da Lead</span>
        <span class="step-val" id="lbl-age-val">--</span>
      </div>
    </div>

    <!-- Activity Tracker (always rendered via JS) -->
    <div id="activity-container"></div>

    <!-- Stage History (locked or unlocked via JS) -->
    <div id="stream-section-wrapper" class="stream-section"></div>

    <div class="footer-row">
      <a id="btn-dashboard" class="btn-link" href="#" target="_blank">
        📈 Ver KPIs Completos do Quadro →
      </a>
    </div>
  </div>

  <script type="module">
    var KEY = import.meta.env.VITE_TRELLO_API_KEY;
    var NAME = 'KPI Master';
    var SITE = 'https://kpismaster.vercel.app';

    var t = TrelloPowerUp.iframe({ appKey: KEY, appName: NAME });

    var locale = t.locale || 'en';
    var isPt = locale.startsWith('pt');

    var translations = {
      pt: {
        title: 'Histórico de Passagem da Lead',
        createdLabel: 'Data de Entrada',
        listLabel: 'Coluna Atual',
        ageLabel: 'Idade da Lead',
        today: 'Hoje',
        yesterday: 'Ontem',
        cycleText: 'Ciclo Total: {days} dias',
        btnText: '📈 Ver KPIs Completos do Quadro →',
        entryText: 'Entrou no dia {date} na lista ',
        movedText: 'Passou para ',
        stayedText: 'passado ',
        currentStayText: 'está nesta lista há ',
        daysUnit: 'dias',
        hoursUnit: 'horas',
        authNotice: 'Autorizar Trello para ver histórico detalhado de datas',
        authBtn: 'Autorizar',
        activityTitle: 'Registo de Atividades da Lead',
        lastAction: 'Última ação: ',
        emailsSent: 'E-mails enviados',
        callsMade: 'Telefonemas realizados',
        addCall: '+1 Telefonema',
        addEmail: '+1 E-mail',
        stageLockedTitle: 'Histórico de Passagens Bloqueado',
        stageLockedSub: 'Deixa uma review para desbloquear grátis!',
        unlockFree: 'Desbloquear Grátis',
        stageHistory: 'Histórico Corrente de Passagens:'
      },
      en: {
        title: 'Lead Stage & Speed History',
        createdLabel: 'Entry Date',
        listLabel: 'Current List',
        ageLabel: 'Lead Age',
        today: 'Today',
        yesterday: 'Yesterday',
        cycleText: 'Total Cycle: {days} days',
        btnText: '📈 View Full Board KPIs →',
        entryText: 'Entered on {date} in list ',
        movedText: 'Moved to ',
        stayedText: 'after ',
        currentStayText: 'currently in this list for ',
        daysUnit: 'days',
        hoursUnit: 'hours',
        authNotice: 'Authorize Trello API to view detailed stage history',
        authBtn: 'Authorize',
        activityTitle: 'Lead Activity Tracker',
        lastAction: 'Last action: ',
        emailsSent: 'Emails sent',
        callsMade: 'Calls made',
        addCall: '+1 Call',
        addEmail: '+1 Email',
        stageLockedTitle: 'Lead Stage & Speed History',
        stageLockedSub: 'Leave a review to unlock for free!',
        unlockFree: 'Unlock for Free',
        stageHistory: 'Stage History:'
      }
    };

    var tDict = isPt ? translations.pt : translations.en;

    document.getElementById('lbl-title').textContent = tDict.title;
    document.getElementById('lbl-created-label').textContent = tDict.createdLabel;
    document.getElementById('lbl-list-label').textContent = tDict.listLabel;
    document.getElementById('lbl-age-label').textContent = tDict.ageLabel;
    document.getElementById('btn-dashboard').textContent = tDict.btnText;

    t.render(function () {
      t.sizeTo(document.body).catch(function () { });

      Promise.all([
        t.card('id', 'name', 'idList', 'dateLastActivity'),
        t.list('id', 'name'),
        t.board('id'),
        t.get('card', 'shared', 'kpi_touchpoints').catch(function () { return null; }),
        t.get('member', 'private', 'kpi_feedback_state').catch(function () { return null; })
      ]).then(function (res) {
        var card = res[0];
        var currentList = res[1];
        var board = res[2];
        var touchpoints = res[3] || { calls: 0, emails: 0, lastUpdated: null };
        var rawFeedbackState = res[4];

        // ── Determine unlock state ──────────────────────────────────────────
        var isUnlocked = false;
        if (rawFeedbackState) {
          try {
            var fState = typeof rawFeedbackState === 'string' ? JSON.parse(rawFeedbackState) : rawFeedbackState;
            if (fState && fState.lastSubmittedTime) isUnlocked = true;
          } catch(e) {}
        }

        // ── Activity Tracker (always visible & functional) ──────────────────
        var activityContainer = document.getElementById('activity-container');
        if (activityContainer && card && card.id) {
          var callCount = touchpoints.calls || 0;
          var emailCount = touchpoints.emails || 0;

          var tsCard = parseInt(card.id.substring(0, 8), 16);
          var lastActivityMs = card.dateLastActivity ? new Date(card.dateLastActivity).getTime() : (tsCard * 1000);
          if (touchpoints.lastUpdated && touchpoints.lastUpdated > lastActivityMs) {
            lastActivityMs = touchpoints.lastUpdated;
          }

          var diffMs2 = Date.now() - lastActivityMs;
          var diffDays2 = Math.floor(diffMs2 / (1000 * 60 * 60 * 24));
          var diffHours2 = Math.floor(diffMs2 / (1000 * 60 * 60));

          var lastUpdateText = '';
          if (diffHours2 < 1) lastUpdateText = isPt ? 'há pouco' : 'just now';
          else if (diffDays2 === 0) lastUpdateText = isPt ? (diffHours2 + 'h atrás') : (diffHours2 + 'h ago');
          else if (diffDays2 === 1) lastUpdateText = isPt ? 'ontem' : 'yesterday';
          else lastUpdateText = isPt ? (diffDays2 + ' dias atrás') : (diffDays2 + ' days ago');

          activityContainer.innerHTML = `
            <div class="activity-section">
              <div class="activity-header">
                <div class="activity-title">
                  <span>⚡</span>
                  <span>${tDict.activityTitle}</span>
                </div>
                <div class="activity-last-update">🕒 ${tDict.lastAction}${lastUpdateText}</div>
              </div>
              <div class="activity-counters-row">
                <div class="counter-card">
                  <span class="counter-number" id="count-emails">${emailCount}</span>
                  <span class="counter-label">✉️ ${tDict.emailsSent}</span>
                </div>
                <div class="counter-card">
                  <span class="counter-number" id="count-calls">${callCount}</span>
                  <span class="counter-label">📞 ${tDict.callsMade}</span>
                </div>
              </div>
              <div class="activity-actions-row">
                <button id="btn-add-call" class="btn-activity">📞 ${tDict.addCall}</button>
                <button id="btn-add-email" class="btn-activity">✉️ ${tDict.addEmail}</button>
              </div>
            </div>
          `;

          function registerAction(type) {
            var updated = {
              calls: (touchpoints.calls || 0) + (type === 'call' ? 1 : 0),
              emails: (touchpoints.emails || 0) + (type === 'email' ? 1 : 0),
              lastUpdated: Date.now()
            };
            return t.set('card', 'shared', 'kpi_touchpoints', updated).then(function () {
              touchpoints = updated;
              var elCalls = document.getElementById('count-calls');
              var elEmails = document.getElementById('count-emails');
              if (elCalls) elCalls.textContent = updated.calls;
              if (elEmails) elEmails.textContent = updated.emails;
              t.sizeTo(document.body).catch(function () {});
            });
          }

          var btnCall = document.getElementById('btn-add-call');
          if (btnCall) btnCall.addEventListener('click', function () { registerAction('call'); });

          var btnEmail = document.getElementById('btn-add-email');
          if (btnEmail) btnEmail.addEventListener('click', function () { registerAction('email'); });
        }

        // ── Card header info ────────────────────────────────────────────────
        if (card && card.id) {
          var timestamp = parseInt(card.id.substring(0, 8), 16);
          var dateCreated = new Date(timestamp * 1000);
          var diffMs = Date.now() - dateCreated.getTime();
          var diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

          var dateStr = dateCreated.toLocaleDateString(isPt ? 'pt-PT' : 'en-US', { month: 'short', day: 'numeric' });

          document.getElementById('lbl-created-val').textContent = dateStr;
          document.getElementById('lbl-list-val').textContent = (currentList && currentList.name) ? currentList.name : 'Ativa';

          var ageText = diffDays === 0 ? tDict.today : (diffDays === 1 ? tDict.yesterday : diffDays + ' dias');
          document.getElementById('lbl-age-val').textContent = ageText;
          document.getElementById('lbl-cycle').textContent = tDict.cycleText.replace('{days}', diffDays);

          // ── Stage History: locked or unlocked ───────────────────────────
          var streamWrapper = document.getElementById('stream-section-wrapper');
          if (!streamWrapper) { t.sizeTo(document.body).catch(function(){}); return; }

          if (!isUnlocked) {
            // 🔒 Locked — show padlock overlay
            streamWrapper.innerHTML = `
              <div id="btn-stream-lock" class="stream-locked-overlay">
                <div class="stream-locked-left">
                  <span class="stream-locked-icon">🔒</span>
                  <div class="stream-locked-text">
                    <span class="stream-locked-title">${tDict.stageLockedTitle}</span>
                    <span class="stream-locked-sub">${tDict.stageLockedSub}</span>
                  </div>
                </div>
                <span class="stream-locked-badge">🔒 ${tDict.unlockFree}</span>
              </div>
            `;

            var btnLock = document.getElementById('btn-stream-lock');
            if (btnLock) {
              btnLock.addEventListener('click', function () {
                t.modal({
                  title: '⭐ Unlock Feature — Feedback',
                  url: window.location.origin + '/trello/feedback.html',
                  height: 520
                });
              });
            }
            t.sizeTo(document.body).catch(function () {});

          } else {
            // ✅ Unlocked — render full stage history timeline
            streamWrapper.innerHTML = `
              <div class="stream-title"><span>📜 ${tDict.stageHistory}</span></div>
              <div id="stream-container" class="stream-timeline"></div>
            `;

            var streamContainer = document.getElementById('stream-container');

            t.getRestApi().isAuthorized().then(function (isAuth) {
              if (!isAuth) {
                streamContainer.innerHTML = `
                  <div class="auth-banner">
                    <span>🔒 ${tDict.authNotice}</span>
                    <button id="btn-auth-stream" class="auth-btn">${tDict.authBtn}</button>
                  </div>
                `;
                var authBtn = document.getElementById('btn-auth-stream');
                if (authBtn) {
                  authBtn.addEventListener('click', function () {
                    t.getRestApi().authorize().then(function () { window.location.reload(); });
                  });
                }
                t.sizeTo(document.body).catch(function () {});
                return;
              }

              return t.getRestApi().getToken().then(function (token) {
                var actionsUrl = 'https://api.trello.com/1/cards/' + card.id + '/actions?filter=updateCard:idList,createCard&key=' + KEY + '&token=' + token;
                return fetch(actionsUrl)
                  .then(function (r) { return r.json(); })
                  .then(function (actions) {
                    if (!Array.isArray(actions) || actions.length === 0) {
                      streamContainer.innerHTML = `
                        <div class="stream-node first latest">
                          <div class="stream-dot"></div>
                          <div class="stream-header">
                            <span class="stream-list-name">📍 ${currentList ? currentList.name : 'Leads'}</span>
                            <span class="stream-date">${dateStr}</span>
                          </div>
                          <div class="stream-stay">
                            ${tDict.entryText.replace('{date}', dateStr)}<strong>${currentList ? currentList.name : 'Leads'}</strong>. (${tDict.currentStayText}<span class="stream-stay-highlight">${diffDays} ${tDict.daysUnit}</span>)
                          </div>
                        </div>
                      `;
                      t.sizeTo(document.body).catch(function () {});
                      return;
                    }

                    var chronological = actions.slice().reverse();
                    var html = '';

                    for (var i = 0; i < chronological.length; i++) {
                      var act = chronological[i];
                      var actDate = new Date(act.date);
                      var formattedDate = actDate.toLocaleDateString(isPt ? 'pt-PT' : 'en-US', {
                        month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                      });

                      var nextDate = (i < chronological.length - 1) ? new Date(chronological[i + 1].date) : new Date();
                      var stayMs = nextDate.getTime() - actDate.getTime();
                      var stayDays = Math.floor(stayMs / (1000 * 60 * 60 * 24));
                      var stayHours = Math.floor((stayMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                      var durationText = stayDays > 0
                        ? (stayDays + ' ' + tDict.daysUnit + (stayHours > 0 ? ' e ' + stayHours + 'h' : ''))
                        : (stayHours + ' ' + tDict.hoursUnit);

                      var isFirst = (i === 0);
                      var isLatest = (i === chronological.length - 1);
                      var listName = '';
                      var nodeText = '';

                      if (act.type === 'createCard') {
                        listName = (act.data && act.data.list) ? act.data.list.name : 'Leads';
                        nodeText = `${tDict.entryText.replace('{date}', formattedDate)}<strong>${listName}</strong>.`;
                      } else if (act.type === 'updateCard' && act.data && act.data.listAfter) {
                        listName = act.data.listAfter.name;
                        if (isLatest) {
                          nodeText = `${tDict.movedText} <strong>${listName}</strong>. (${tDict.currentStayText}<span class="stream-stay-highlight">${durationText}</span>)`;
                        } else {
                          nodeText = `${tDict.movedText} <strong>${listName}</strong> ${tDict.stayedText}<span class="stream-stay-highlight">${durationText}</span>.`;
                        }
                      }

                      if (listName) {
                        var nodeClass = 'stream-node' + (isFirst ? ' first' : '') + (isLatest ? ' latest' : '');
                        html += `
                          <div class="${nodeClass}">
                            <div class="stream-dot"></div>
                            <div class="stream-header">
                              <span class="stream-list-name">${isFirst ? '📍' : (isLatest ? '🎯' : '➡️')} ${listName}</span>
                              <span class="stream-date">${formattedDate}</span>
                            </div>
                            <div class="stream-stay">${nodeText}</div>
                          </div>
                        `;
                      }
                    }

                    if (html) streamContainer.innerHTML = html;
                    t.sizeTo(document.body).catch(function () {});
                  });
              });
            }).catch(function () {
              streamContainer.innerHTML = `
                <div class="stream-node first latest">
                  <div class="stream-dot"></div>
                  <div class="stream-header">
                    <span class="stream-list-name">📍 ${currentList ? currentList.name : 'Leads'}</span>
                    <span class="stream-date">${dateStr}</span>
                  </div>
                  <div class="stream-stay">
                    ${tDict.entryText.replace('{date}', dateStr)}<strong>${currentList ? currentList.name : 'Leads'}</strong>.
                  </div>
                </div>
              `;
              t.sizeTo(document.body).catch(function () {});
            });
          }
        }

        // ── Dashboard button ────────────────────────────────────────────────
        if (board && board.id) {
          var boardId = board.id;
          document.getElementById('btn-dashboard').href = SITE + '#board=' + boardId;
          t.getRestApi().isAuthorized().then(function (isAuth) {
            if (isAuth) return t.getRestApi().getToken();
            throw new Error('Not authorized');
          }).then(function (token) {
            if (token) document.getElementById('btn-dashboard').href = SITE + '#board=' + boardId + '&token=' + token;
          }).catch(function () {});
        } else {
          document.getElementById('btn-dashboard').href = SITE;
        }

        document.getElementById('btn-dashboard').addEventListener('click', function (e) {
          e.preventDefault();
          t.board('id').then(function (b) {
            if (!b || !b.id) { window.open(SITE, '_blank'); return; }
            var bId = b.id;
            t.getRestApi().isAuthorized().then(function (isAuth) {
              if (isAuth) return t.getRestApi().getToken();
              throw new Error('Not authorized');
            }).then(function (token) {
              window.open(SITE + '#board=' + bId + (token ? '&token=' + token : ''), '_blank');
            }).catch(function () {
              window.open(SITE + '#board=' + bId, '_blank');
            });
          }).catch(function () { window.open(SITE, '_blank'); });
        });

        setTimeout(function () { t.sizeTo(document.body).catch(function () {}); }, 100);

      }).catch(function (err) {
        console.error('[KPI Master] Could not load card details:', err);
        t.sizeTo(document.body).catch(function () {});
      });
    });
  </script>

</body>
</html>
