<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Log</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111726;
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --call-color: #34d399;
      --email-color: #a78bfa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 18px 20px;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .header h2 {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ffffff;
    }

    .stats-badges {
      display: flex;
      gap: 8px;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .badge-call {
      background: rgba(16, 185, 129, 0.15);
      color: var(--call-color);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-email {
      background: rgba(139, 92, 246, 0.15);
      color: var(--email-color);
      border: 1px solid rgba(139, 92, 246, 0.3);
    }

    .log-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .log-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .log-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .log-icon {
      font-size: 16px;
    }

    .log-author {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-main);
    }

    .log-action {
      font-size: 11px;
      color: var(--text-sub);
    }

    .log-date {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-sub);
      text-align: right;
    }

    .empty-state {
      text-align: center;
      padding: 36px 12px;
      color: var(--text-sub);
      font-size: 12.5px;
    }
  </style>
</head>

<body>
  <div class="header">
    <h2 id="modal-title">Histórico de Contactos</h2>
    <div class="stats-badges">
      <span class="badge badge-call" id="badge-calls">0 Chamadas</span>
      <span class="badge badge-email" id="badge-emails">0 Emails</span>
    </div>
  </div>

  <div id="log-list" class="log-list">
    <!-- Populated dynamically -->
  </div>

  <script type="module">
    import { Analytics } from '../js/analytics.js';
    Analytics.init();

    var KEY = import.meta.env.VITE_TRELLO_API_KEY;
    var t = TrelloPowerUp.iframe({ appKey: KEY, appName: 'KPI Master' });

    var isPt = false;
    t.get('member', 'private', 'kpi_user_lang').then(function (lang) {
      isPt = lang === 'pt';
      applyLang();
      loadLogs();
    }).catch(function () {
      applyLang();
      loadLogs();
    });

    function applyLang() {
      document.getElementById('modal-title').textContent = isPt ? 'Histórico de Contactos' : 'Contact History';
    }

    function loadLogs() {
      t.get('card', 'shared', 'kpi_touchpoints_history').then(function (rawHistory) {
        var logs = Array.isArray(rawHistory) ? rawHistory : [];
        var callsCount = 0;
        var emailsCount = 0;

        logs.forEach(function (l) {
          if (l.type === 'call') callsCount++;
          if (l.type === 'email') emailsCount++;
        });

        document.getElementById('badge-calls').textContent = callsCount + (isPt ? ' Chamadas' : ' Calls');
        document.getElementById('badge-emails').textContent = emailsCount + (isPt ? ' Emails' : ' Emails');

        var listEl = document.getElementById('log-list');
        if (logs.length === 0) {
          listEl.innerHTML = '<div class="empty-state">' + (isPt ? 'Nenhum contacto registado ainda.' : 'No contact logs recorded yet.') + '</div>';
          t.sizeTo(document.body).catch(function () { });
          return;
        }

        // Mostrar os mais recentes primeiro
        var reversed = logs.slice().reverse();
        var html = '';
        reversed.forEach(function (l) {
          var isCall = l.type === 'call';
          var iconSvg = isCall
            ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>'
            : '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#c084fc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>';

          var outcomeBadge = '';
          if (isCall) {
            if (l.outcome === 'answered') {
              outcomeBadge = ' <span style="display:inline-flex; align-items:center; gap:3px; font-size:10px; font-weight:700; color:#34d399; background:rgba(16,185,129,0.12); border:1px solid rgba(16,185,129,0.3); padding:2px 8px; border-radius:999px; margin-left:6px;"><span style="width:5px; height:5px; border-radius:50%; background:#10b981;"></span>' + (isPt ? 'Atendida' : 'Answered') + '</span>';
            } else if (l.outcome === 'no-answer') {
              outcomeBadge = ' <span style="display:inline-flex; align-items:center; gap:3px; font-size:10px; font-weight:700; color:#f87171; background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.3); padding:2px 8px; border-radius:999px; margin-left:6px;"><span style="width:5px; height:5px; border-radius:50%; background:#f87171;"></span>' + (isPt ? 'Não Atendida' : 'No Answer') + '</span>';
            }
          }

          var actionText = isCall
            ? (isPt ? 'fez uma chamada' : 'made a call')
            : (isPt ? 'enviou um email' : 'sent an email');

          html += `
            <div class="log-item">
              <div class="log-left">
                <span class="log-icon" style="display:flex; align-items:center;">${iconSvg}</span>
                <div>
                  <div class="log-author" style="display:flex; align-items:center;">${l.author || (isPt ? 'Membro' : 'Member')}${outcomeBadge}</div>
                  <div class="log-action">${actionText}</div>
                </div>
              </div>
              <div class="log-date">${l.formattedDate || ''}</div>
            </div>
          `;
        });

        listEl.innerHTML = html;
        t.sizeTo(document.body).catch(function () { });
      }).catch(function () {
        document.getElementById('log-list').innerHTML = '<div class="empty-state">No logs found.</div>';
      });
    }
  </script>
</body>

</html>
