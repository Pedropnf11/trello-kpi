<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="utf-8">
  <title>KPI Master — Power-Up</title>
  <!-- Forçar HTTPS e sem cache -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>

<body>
  <script type="module">
    var POWERUP_URL = window.location.origin + '/trello';
    var SITE_URL = 'https://kpismaster.vercel.app';
    var welcomePrompted = false;

    TrelloPowerUp.initialize({

      // ── Instalação / Boas-vindas (on-enable) ─────────────────────────────
      'on-enable': function (t) {
        return t.modal({
          title: 'Bem-vindo ao KPI Master',
          url: POWERUP_URL + '/welcome.html',
          height: 540
        });
      },

      // ── Botão na barra do board + Abertura Automática ao Abrir o Quadro ───
      'board-buttons': function (t) {
        var CURRENT_VERSION = '1.6';
        var isPt = (t.locale || 'en').startsWith('pt');

        function shouldPromptFeedback(rawState, welcomeSeenVal, firstSeenTimeVal) {
          var now = Date.now();
          var DAY = 24 * 60 * 60 * 1000;

          // Regra: Se instalou a app há menos de 3 dias -> NÃO PERGUNTA FEEDBACK
          var installTime = null;
          if (typeof firstSeenTimeVal === 'number') installTime = firstSeenTimeVal;
          else if (typeof welcomeSeenVal === 'number') installTime = welcomeSeenVal;

          if (installTime && (now - installTime < 3 * DAY)) {
            return false;
          }

          if (!rawState) {
            // Se ainda não tem estado de feedback mas já passaram pelo menos 3 dias da instalação
            return true;
          }

          try {
            var state = typeof rawState === 'string' ? JSON.parse(rawState) : rawState;

            // Se enviou feedback nos últimos 30 dias -> NÃO PERGUNTA
            if (state.lastSubmittedTime && (now - state.lastSubmittedTime < 30 * DAY)) {
              return false;
            }

            var lastPrompt = state.lastPromptTime || installTime || 0;
            var elapsed = now - lastPrompt;
            var count = state.ignoredCount || 0;

            var requiredCooldown = 7 * DAY;
            if (count === 1) requiredCooldown = 2 * DAY;      // 1.ª vez que ignorou -> 2 dias
            else if (count === 2) requiredCooldown = 7 * DAY;  // 2.ª vez que ignorou -> 1 semana (7 dias)
            else if (count === 3) requiredCooldown = 14 * DAY; // 3.ª vez que ignorou -> 2 semanas (14 dias)
            else if (count >= 4) requiredCooldown = 30 * DAY;  // 4.ª+ vez que ignorou -> 1 mês (30 dias)

            return elapsed >= requiredCooldown;
          } catch(e) {
            return false;
          }
        }

        return Promise.all([
          t.get('member', 'private', 'kpi_welcome_seen').catch(function () { return false; }),
          t.get('member', 'private', 'kpi_last_seen_version').catch(function () { return null; }),
          t.get('member', 'private', 'kpi_feedback_state').catch(function () { return null; }),
          t.get('member', 'private', 'kpi_first_seen_time').catch(function () { return null; })
        ]).then(function (res) {
          var hasSeenWelcome = res[0];
          var lastSeenVersion = res[1];
          var rawFeedbackState = res[2];
          var firstSeenTime = res[3];

          var hasNewUpdate = hasSeenWelcome && (lastSeenVersion !== CURRENT_VERSION);
          var needsFeedback = hasSeenWelcome && shouldPromptFeedback(rawFeedbackState, hasSeenWelcome, firstSeenTime);

          // Dispara o Welcome, Novidades ou Feedback inteligente
          if (!welcomePrompted) {
            if (!hasSeenWelcome) {
              welcomePrompted = true;
              t.modal({
                title: 'Bem-vindo ao KPI Master',
                url: POWERUP_URL + '/welcome.html',
                height: 540
              });
            } else if (hasNewUpdate) {
              welcomePrompted = true;
              t.set('member', 'private', 'kpi_last_seen_version', CURRENT_VERSION).catch(function () { });
              t.modal({
                title: isPt ? ('✨ Novidades da Versão ' + CURRENT_VERSION + ' — KPI Master') : ('✨ What\'s New in Version ' + CURRENT_VERSION + ' — KPI Master'),
                url: POWERUP_URL + '/updates.html',
                height: 560
              });

              // Se também precisa de dar feedback, aguarda 2 minutos (120.000 ms) antes de abrir o feedback!
              if (needsFeedback) {
                setTimeout(function () {
                  var state = rawFeedbackState ? (typeof rawFeedbackState === 'string' ? JSON.parse(rawFeedbackState) : rawFeedbackState) : { ignoredCount: 0 };
                  state.lastPromptTime = Date.now();
                  state.ignoredCount = (state.ignoredCount || 0) + 1;
                  t.set('member', 'private', 'kpi_feedback_state', JSON.stringify(state)).catch(function () { });

                  t.modal({
                    title: isPt ? '⭐ A Tua Opinião — KPI Master' : '⭐ Your Feedback — KPI Master',
                    url: POWERUP_URL + '/feedback.html',
                    height: 520
                  });
                }, 120000);
              }
            } else if (needsFeedback) {
              welcomePrompted = true;
              var state = rawFeedbackState ? (typeof rawFeedbackState === 'string' ? JSON.parse(rawFeedbackState) : rawFeedbackState) : { ignoredCount: 0 };
              state.lastPromptTime = Date.now();
              state.ignoredCount = (state.ignoredCount || 0) + 1;
              t.set('member', 'private', 'kpi_feedback_state', JSON.stringify(state)).catch(function () { });

              t.modal({
                title: isPt ? '⭐ A Tua Opinião — KPI Master' : '⭐ Your Feedback — KPI Master',
                url: POWERUP_URL + '/feedback.html',
                height: 520
              });
            }
          }

          return [{
            icon: {
              dark: POWERUP_URL + '/icon.png',
              light: POWERUP_URL + '/icon.png'
            },
            text: 'KPI Master',
            callback: function (t) {
              if (!hasSeenWelcome) {
                return t.modal({
                  title: 'Bem-vindo ao KPI Master',
                  url: POWERUP_URL + '/welcome.html',
                  height: 540
                });
              }

              return t.getRestApi().isAuthorized().then(function (isAuth) {
                if (!isAuth) {
                  return t.modal({
                    title: 'Ligar ao KPI Master',
                    url: POWERUP_URL + '/auth.html',
                    height: 420
                  });
                }
                return t.modal({
                  title: 'KPI Master',
                  url: POWERUP_URL + '/dashboard.html',
                  height: 620,
                  fullscreen: false
                });
              });
            }
          }];
        });
      },

      // ── Estado de autenticação ────────────────────────────────────────────
      'authorization-status': function (t) {
        return t.getRestApi().isAuthorized().then(function (isAuth) {
          return { authorized: isAuth };
        });
      },

      // ── Ecrã de login ─────────────────────────────────────────────────────
      'show-authorization': function (t) {
        return t.modal({
          title: 'Ligar ao KPI Master',
          url: POWERUP_URL + '/auth.html',
          height: 420
        });
      },

      // ── Ecrã de settings ─────────────────────────────────────────────────
      'show-settings': function (t) {
        return t.modal({
          title: 'Definições — KPI Master',
          url: POWERUP_URL + '/settings.html',
          height: 420
        });
      },

      // ── Emblemas nos cartões (Card Badges) ──────────────────────────────────
      'card-badges': function (t) {
        return t.card('id')
          .then(function (card) {
            if (!card || !card.id) return [];

            // O ID do Trello contém a data de criação nos primeiros 8 caracteres em hexadecimal
            var timestamp = parseInt(card.id.substring(0, 8), 16);
            var dateCreated = new Date(timestamp * 1000);
            var diffMs = Date.now() - dateCreated.getTime();
            var diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

            var text = '';
            var color = 'light-gray';

            var isPt = (t.locale || 'en').startsWith('pt');

            if (diffDays === 0) {
              text = isPt ? 'Criado hoje' : 'Created today';
              color = 'green';
            } else if (diffDays === 1) {
              text = isPt ? '1 dia' : '1 day old';
            } else {
              text = isPt ? diffDays + ' dias' : diffDays + ' days old';
              if (diffDays > 14) {
                color = 'yellow';
              }
              if (diffDays > 30) {
                color = 'red';
              }
            }

            return [{
              text: '🕒 ' + text,
              color: color
            }];
          });
      },

      // ── Emblemas de Detalhes no Verso (Card Detail Badges) ──────────────────
      'card-detail-badges': function (t) {
        return t.card('id')
          .then(function (card) {
            if (!card || !card.id) return [];

            var timestamp = parseInt(card.id.substring(0, 8), 16);
            var dateCreated = new Date(timestamp * 1000);
            var diffMs = Date.now() - dateCreated.getTime();
            var diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

            var isPt = (t.locale || 'en').startsWith('pt');
            var text = '';
            if (diffDays === 0) {
              text = isPt ? 'Hoje' : 'Today';
            } else if (diffDays === 1) {
              text = isPt ? '1 dia' : '1 day';
            } else {
              text = isPt ? diffDays + ' dias' : diffDays + ' days';
            }

            return [{
              title: isPt ? 'Idade do Cartão' : 'Card Age',
              text: text,
              color: 'light-gray'
            }];
          });
      },

      // ── Botões de Ação no Cartão (Card Buttons) ───────────────────────────
      'card-buttons': function (t) {
        var isPt = (t.locale || 'en').startsWith('pt');
        return [{
          icon: POWERUP_URL + '/icon.png',
          text: isPt ? '⏩ Mover para Próxima Etapa' : '⏩ Move to Next Stage',
          callback: function (t) {
            return t.card('id', 'idList').then(function (card) {
              return t.lists('id', 'name').then(function (lists) {
                var currentIndex = -1;
                for (var i = 0; i < lists.length; i++) {
                  if (lists[i].id === card.idList) {
                    currentIndex = i;
                    break;
                  }
                }
                if (currentIndex === -1 || currentIndex >= lists.length - 1) {
                  return t.popup({
                    title: isPt ? 'Aviso' : 'Notice',
                    items: [{
                      text: isPt ? 'Este cartão já está na última coluna!' : 'Card is already in the last list!'
                    }]
                  });
                }

                var nextList = lists[currentIndex + 1];

                return t.getRestApi().isAuthorized().then(function (isAuth) {
                  if (!isAuth) {
                    return t.modal({
                      title: isPt ? 'Ligar ao KPI Master' : 'Connect KPI Master',
                      url: './auth.html',
                      height: 420
                    });
                  }

                  return t.getRestApi().getToken().then(function (token) {
                    return fetch('https://api.trello.com/1/cards/' + card.id + '?idList=' + nextList.id + '&key=' + import.meta.env.VITE_TRELLO_API_KEY + '&token=' + token, {
                      method: 'PUT'
                    }).then(function (res) {
                      if (res.ok) {
                        return t.alert({
                          message: (isPt ? 'Movido com sucesso para: ' : 'Moved to: ') + nextList.name,
                          duration: 3
                        });
                      } else {
                        throw new Error('Falha ao mover');
                      }
                    });
                  });
                });
              });
            });
          }
        }];
      },

      // ── Secção do Verso do Cartão (Card Back Section) ──────────────────────
      'card-back-section': function (t) {
        var isPt = (t.locale || 'en').startsWith('pt');
        return {
          title: isPt ? 'Histórico & Velocidade da Lead' : 'Lead Stage & Speed History',
          icon: POWERUP_URL + '/icon.png',
          content: {
            type: 'iframe',
            url: t.signUrl(POWERUP_URL + '/card-back.html'),
            height: 380
          }
        };
      },

      // ── Ordenadores de Lista (List Sorters) ──────────────────────────────────
      'list-sorters': function (t) {
        var isPt = (t.locale || 'en').startsWith('pt');
        return [{
          text: isPt ? '⏳ Idade da Lead: Mais Antigos Primeiro (Evitar Perdas)' : '⏳ Lead Age: Oldest First (Prevent Loss)',
          callback: function (t, opts) {
            var sortedCards = opts.cards.sort(function (a, b) {
              var tA = parseInt(a.id.substring(0, 8), 16);
              var tB = parseInt(b.id.substring(0, 8), 16);
              return tA - tB;
            });
            return {
              sortedCardIds: sortedCards.map(function (c) { return c.id; })
            };
          }
        }, {
          text: isPt ? '⚡ Idade da Lead: Mais Recentes Primeiro' : '⚡ Lead Age: Newest First',
          callback: function (t, opts) {
            var sortedCards = opts.cards.sort(function (a, b) {
              var tA = parseInt(a.id.substring(0, 8), 16);
              var tB = parseInt(b.id.substring(0, 8), 16);
              return tB - tA;
            });
            return {
              sortedCardIds: sortedCards.map(function (c) { return c.id; })
            };
          }
        }];
      }

    }, {
      appName: 'KPI Master',
      appKey: import.meta.env.VITE_TRELLO_API_KEY
    });
  </script>
</body>

</html>
