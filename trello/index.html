<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="utf-8">
  <title>KPI Master — Power-Up</title>
  <!-- Forçar HTTPS e sem cache -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>

<body>
  <script type="module">
    import { Analytics } from '../js/analytics.js';
    Analytics.init();

    var BASE_DOMAIN = 'https://kpismaster.vercel.app';
    var POWERUP_URL = BASE_DOMAIN + '/trello';
    var SITE_URL = 'https://kpismaster.vercel.app';
    var SITE = SITE_URL;
    var welcomePrompted = false;

    function getUserIsPt(t) {
      return t.get('member', 'private', 'kpi_user_lang').then(function (lang) {
        return lang === 'pt';
      }).catch(function () {
        return false;
      });
    }

    function isFeedbackUnlocked(t) {
      var localReviewed = false;
      try {
        localReviewed = (
          localStorage.getItem('kpi_feedback_submitted_globally') === 'true' ||
          localStorage.getItem('kpi_has_reviewed') === 'true'
        );
      } catch (e) {}

      if (localReviewed) return Promise.resolve(true);

      return Promise.all([
        t.get('member', 'private', 'kpi_has_reviewed').catch(function () { return false; }),
        t.get('member', 'private', 'kpi_feedback_state').catch(function () { return null; }),
        t.get('member', 'shared', 'kpi_has_reviewed').catch(function () { return false; }),
        t.get('board', 'shared', 'kpi_feedback_submitted_globally').catch(function () { return false; })
      ]).then(function (results) {
        var flagMemberPriv = (results[0] === true || results[0] === 'true');
        var rawState = results[1];
        var stateObj = (rawState && typeof rawState === 'string') ? JSON.parse(rawState) : rawState;
        var hasSubmittedTime = stateObj && (stateObj.lastSubmittedTime > 0);
        var flagMemberShared = (results[2] === true || results[2] === 'true');
        var flagBoardShared = (results[3] === true || results[3] === 'true');

        var isReviewed = Boolean(localReviewed || flagMemberPriv || hasSubmittedTime || flagMemberShared || flagBoardShared);
        if (isReviewed) {
          try {
            localStorage.setItem('kpi_feedback_submitted_globally', 'true');
            localStorage.setItem('kpi_has_reviewed', 'true');
          } catch (e) {}
        }
        return isReviewed;
      });
    }

    window.resetKpiFeedback = function (tInstance) {
      try {
        localStorage.removeItem('kpi_feedback_submitted_globally');
        localStorage.removeItem('kpi_has_reviewed');
        localStorage.removeItem('kpi_feedback_onboarding_seen_manager');
        localStorage.removeItem('kpi_feedback_onboarding_seen_sales');
      } catch (e) {}
      if (tInstance) {
        return Promise.all([
          tInstance.set('member', 'private', 'kpi_feedback_state', null).catch(function () {}),
          tInstance.set('member', 'private', 'kpi_has_reviewed', false).catch(function () {}),
          tInstance.set('member', 'shared', 'kpi_has_reviewed', false).catch(function () {}),
          tInstance.set('board', 'shared', 'kpi_feedback_submitted_globally', false).catch(function () {})
        ]);
      }
      return Promise.resolve(true);
    };

    TrelloPowerUp.initialize({

      // ── Instalação / Boas-vindas (on-enable) ─────────────────────────────
      'on-enable': function (t) {
        return t.modal({
          title: 'Bem-vindo ao KPI Master',
          accentColor: '#090d16',
          url: POWERUP_URL + '/welcome.html?v=16',
          height: 700
        });
      },

      // ── Botão na barra do board (Sem popups automáticos não solicitados) ───
      'board-buttons': function (t) {
        return getUserIsPt(t).then(function (isPt) {
          return [{
            icon: {
              dark: POWERUP_URL + '/icon.png',
              light: POWERUP_URL + '/icon.png'
            },
            text: isPt ? 'Leads KPIs Master | Abrir Micro Dashboard' : 'Leads KPIs Master | Open Micro Dashboard',
            callback: function (t) {
              Analytics.track('micro_dashboard_button_clicked', {
                board_id: t.getContext().board,
                member_id: t.getContext().member,
                description: 'Utilizador clicou no botão de abrir o Micro Dashboard'
              });

              return t.get('member', 'private', 'kpi_welcome_seen').catch(function () { return false; }).then(function (hasSeenWelcome) {
                if (!hasSeenWelcome) {
                  return t.modal({
                    title: isPt ? 'Bem-vindo ao KPI Master' : 'Welcome to KPI Master',
                    accentColor: '#090d16',
                    url: POWERUP_URL + '/welcome.html?v=16',
                    height: 700
                  });
                }

                return t.getRestApi().isAuthorized().then(function (isAuth) {
                  if (!isAuth) {
                    return t.modal({
                      title: isPt ? 'Ligar ao KPI Master' : 'Connect KPI Master',
                      accentColor: '#090d16',
                      url: POWERUP_URL + '/auth.html?v=3',
                      height: 420
                    });
                  }
                  return t.modal({
                    title: ' ',
                    url: POWERUP_URL + '/dashboard.html?v=9',
                    height: 690,
                    fullscreen: false,
                    accentColor: '#090d16'
                  });
                });
              });
            }
          }];
        });
      },

      // ── Estado de autenticação ────────────────────────────────────────────
      'authorization-status': function (t) {
        return t.getRestApi().isAuthorized().then(function (isAuth) {
          return { authorized: isAuth };
        });
      },

      // ── Ecrã de login ─────────────────────────────────────────────────────
      'show-authorization': function (t) {
        return t.modal({
          title: 'Ligar ao KPI Master',
          accentColor: '#090d16',
          url: POWERUP_URL + '/auth.html?v=3',
          height: 420
        });
      },

      // ── Ecrã de settings ─────────────────────────────────────────────────
      'show-settings': function (t) {
        return t.modal({
          title: 'Definições — KPI Master',
          accentColor: '#090d16',
          url: POWERUP_URL + '/settings.html?v=3',
          height: 420
        });
      },

      // ── Emblemas nos cartões (Card Badges) ──────────────────────────────────
      'card-badges': function (t) {
        return t.card('id', 'dateLastActivity').then(function (card) {

          if (!card || !card.id) return [];

          var isPt = (t.locale || 'en').startsWith('pt');
          var badges = [];

          // 1. Badge: Idade do Cartão (Card Age) - respeita definição Plug & Play
          return t.get('board', 'shared', 'kpi_card_age_enabled').catch(function () { return true; }).then(function (isCardAgeEnabled) {
            var showCardAge = (isCardAgeEnabled === undefined || isCardAgeEnabled === null || isCardAgeEnabled === true || isCardAgeEnabled === 'true');

            if (showCardAge) {
              var timestamp = parseInt(card.id.substring(0, 8), 16);
              var dateCreated = new Date(timestamp * 1000);
              var diffMs = Date.now() - dateCreated.getTime();
              var diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

              var ageText = '';
              var ageColor = null;

              if (diffDays === 0) {
                ageText = isPt ? 'Criado hoje' : 'Created today';
                ageColor = 'green';
              } else if (diffDays === 1) {
                ageText = isPt ? '1 dia' : '1 day old';
              } else {
                ageText = isPt ? diffDays + ' dias' : diffDays + ' days old';
                if (diffDays > 14) ageColor = 'yellow';
                if (diffDays > 30) ageColor = 'red';
              }

              badges.push({
                text: ageText,
                color: ageColor
              });
            }

            // Dynamic badge rereads Trello activity and touchpoints, so +1 Call/Email updates the front.
            badges.push({
              dynamic: function () {
                return Promise.all([
                  t.card('id', 'dateLastActivity'),
                  t.get('card', 'shared', 'kpi_touchpoints').catch(function () { return null; })
                ]).then(function (values) {
                  var currentCard = values[0] || card;
                  var touchpoints = values[1] || {};
                  var trelloActivityMs = currentCard.dateLastActivity
                    ? new Date(currentCard.dateLastActivity).getTime()
                    : dateCreated.getTime();
                  var touchpointActivityMs = Number(touchpoints.lastUpdated) || 0;
                  var lastActivityMs = Math.max(trelloActivityMs, touchpointActivityMs);
                  var ageMs = Math.max(0, Date.now() - lastActivityMs);
                  var days = Math.floor(ageMs / (1000 * 60 * 60 * 24));
                  var hours = Math.floor(ageMs / (1000 * 60 * 60));
                  var formattedLastActivity = new Date(lastActivityMs).toLocaleString(isPt ? 'pt-PT' : 'en-GB', {
                    day: '2-digit',
                    month: 'short',
                    hour: '2-digit',
                    minute: '2-digit'
                  });

                  return {
                    text: isPt
                      ? 'Última atualização: ' + formattedLastActivity
                      : 'Last update: ' + formattedLastActivity,
                    color: hours < 24 ? 'green' : (days >= 7 ? 'red' : (days >= 3 ? 'yellow' : null)),
                    refresh: 10
                  };
                });
              }
            });

            return badges;
          });
        }).catch(function (err) {
          console.error('[KPI Master] Error in card-badges:', err);
          return [];
        });
      },

      // ── Emblemas de Detalhes no Verso (Card Detail Badges) ──────────────────
      'card-detail-badges': function (t) {
        return t.card('id', 'dateLastActivity').then(function (card) {
          if (!card || !card.id) return [];

          var isPt = (t.locale || 'en').startsWith('pt');
          var timestamp = parseInt(card.id.substring(0, 8), 16);
          var dateCreated = new Date(timestamp * 1000);
          var diffMs = Date.now() - dateCreated.getTime();
          var diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

          var ageText = diffDays === 0 ? (isPt ? 'Hoje' : 'Today') : (diffDays === 1 ? (isPt ? '1 dia' : '1 day') : (diffDays + (isPt ? ' dias' : ' days')));

          var lastActivityMs = card.dateLastActivity ? new Date(card.dateLastActivity).getTime() : dateCreated.getTime();
          var updateDiffDays = Math.floor(Math.max(0, Date.now() - lastActivityMs) / (1000 * 60 * 60 * 24));
          var updateText = updateDiffDays === 0 ? (isPt ? 'Hoje' : 'Today') : (updateDiffDays === 1 ? (isPt ? 'Ontem' : 'Yesterday') : (updateDiffDays + (isPt ? ' dias atrás' : ' days ago')));
          var updateColor = updateDiffDays === 0 ? 'green' : (updateDiffDays >= 7 ? 'red' : (updateDiffDays >= 3 ? 'yellow' : null));

          return [
            {
              title: isPt ? 'Idade do Cartão' : 'Card Age',
              text: ageText,
              color: null
            },
            {
              title: isPt ? 'Última Atividade' : 'Last Activity',
              text: updateText,
              color: updateColor
            }
          ];
        }).catch(function (err) {
          console.error('[KPI Master] Error in card-detail-badges:', err);
          return [];
        });
      },

      // ── Botões de Ação no Cartão (Card Buttons) ───────────────────────────
      'card-buttons': function (t) {
        return Promise.all([
          getUserIsPt(t),
          isFeedbackUnlocked(t)
        ]).then(function (res) {
          var isPt = res[0];
          var hasReviewed = Boolean(res[1]);

          function addTouchpoint(tCard, type) {
            return tCard.get('card', 'shared', 'kpi_touchpoints')
              .catch(function () { return null; })
              .then(function (saved) {
                var current = saved || {};
                var updated = {
                  calls: (Number(current.calls) || 0) + (type === 'call' ? 1 : 0),
                  emails: (Number(current.emails) || 0) + (type === 'email' ? 1 : 0),
                  lastUpdated: Date.now()
                };
                return tCard.set('card', 'shared', 'kpi_touchpoints', updated).then(function () {
                  return tCard.alert({
                    message: type === 'call'
                      ? (isPt ? '📞 Telefonema registado!' : '📞 Call recorded!')
                      : (isPt ? '✉️ E-mail registado!' : '✉️ Email recorded!'),
                    duration: 3
                  });
                });
              });
          }

          return [
            {
              icon: POWERUP_URL + '/icon.png',
              text: isPt ? '📞 +1 Telefonema' : '📞 +1 Call',
              callback: function (tCard) { return addTouchpoint(tCard, 'call'); }
            },
            {
              icon: POWERUP_URL + '/icon.png',
              text: isPt ? '✉️ +1 E-mail' : '✉️ +1 Email',
              callback: function (tCard) { return addTouchpoint(tCard, 'email'); }
            },
            {
              icon: POWERUP_URL + '/icon.png',
              text: isPt ? '⏩ Mover para Próxima Etapa' : '⏩ Move to Next Stage',
              callback: function (t) {
                return t.card('id', 'idList').then(function (card) {
                  return t.lists('id', 'name').then(function (lists) {
                    var currentIndex = -1;
                    for (var i = 0; i < lists.length; i++) {
                      if (lists[i].id === card.idList) {
                        currentIndex = i;
                        break;
                      }
                    }
                    if (currentIndex === -1 || currentIndex >= lists.length - 1) {
                      return t.popup({
                        title: isPt ? 'Aviso' : 'Notice',
                        items: [{
                          text: isPt ? 'Este cartão já está na última coluna!' : 'Card is already in the last list!'
                        }]
                      });
                    }

                    var nextList = lists[currentIndex + 1];

                    return t.getRestApi().isAuthorized().then(function (isAuth) {
                      if (!isAuth) {
                        return t.modal({
                          title: isPt ? 'Ligar ao KPI Master' : 'Connect KPI Master',
                          accentColor: '#090d16',
                          url: POWERUP_URL + '/auth.html?v=3',
                          height: 420
                        });
                      }

                      return t.getRestApi().getToken().then(function (token) {
                        return fetch('https://api.trello.com/1/cards/' + card.id + '?idList=' + nextList.id + '&key=' + KEY + '&token=' + token, {
                          method: 'PUT'
                        }).then(function (res) {
                          if (res.ok) {
                            return t.alert({
                              message: (isPt ? 'Movido com sucesso para: ' : 'Moved to: ') + nextList.name,
                              duration: 3
                            });
                          } else {
                            throw new Error('Falha ao mover');
                          }
                        });
                      });
                    });
                  });
                });
              }
            }
          ];
        });
      },

      // ── Secção do Verso do Cartão (Card Back Section) ──────────────────────
      'card-back-section': function (t) {
        return Promise.all([
          t.get('member', 'private', 'kpi_feedback_state').catch(function () { return null; }),
          t.get('member', 'private', 'kpi_has_reviewed').catch(function () { return false; }),
          getUserIsPt(t)
        ]).then(function (results) {
          var rawFeedbackState = results[0];
          var hasReviewedFlag = (results[1] === true || results[1] === 'true');
          var isPt = results[2];

          var state = null;
          if (rawFeedbackState) {
            state = typeof rawFeedbackState === 'string' ? JSON.parse(rawFeedbackState) : rawFeedbackState;
          }
          var hasSubmitted = false;
          if ((state && state.lastSubmittedTime) || hasReviewedFlag) {
            hasSubmitted = true;
          }

          var displayTitle = isPt ? 'KPI Master — Ritmo das Leads' : 'KPI Master — Lead Momentum';

          return {
            title: displayTitle,
            icon: POWERUP_URL + '/icon.png',
            content: {
              type: 'iframe',
              url: t.signUrl(POWERUP_URL + '/card-back.html?v=9'),
              height: 520
            }
          };
        }).catch(function () {
          return getUserIsPt(t).then(function (isPt) {
            var displayTitle = isPt ? 'KPI Master — Ritmo das Leads' : 'KPI Master — Lead Momentum';
            return {
              title: displayTitle,
              icon: POWERUP_URL + '/icon.png',
              content: {
                type: 'iframe',
                url: t.signUrl(POWERUP_URL + '/card-back.html?v=9'),
                height: 520
              }
            };
          });
        });
      },

      // ── Ordenadores de Lista (List Sorters) ──────────────────────────────────
      'list-sorters': function (t) {
        return getUserIsPt(t).then(function (isPt) {
          return [{
            text: isPt ? '⏳ Idade da Lead: Mais Antigos Primeiro (Evitar Perdas)' : '⏳ Lead Age: Oldest First (Prevent Loss)',
            callback: function (t, opts) {
              Analytics.track('list_sort_executed', {
                sort_order: 'oldest_first',
                total_cards: (opts.cards || []).length,
                description: 'Utilizador ordenou a lista por Mais Antigos Primeiro'
              });
              var sortedCards = opts.cards.sort(function (a, b) {
                var tA = parseInt(a.id.substring(0, 8), 16);
                var tB = parseInt(b.id.substring(0, 8), 16);
                return tA - tB;
              });
              return {
                sortedCardIds: sortedCards.map(function (c) { return c.id; })
              };
            }
          }, {
            text: isPt ? '⚡ Idade da Lead: Mais Recentes Primeiro' : '⚡ Lead Age: Newest First',
            callback: function (t, opts) {
              Analytics.track('list_sort_executed', {
                sort_order: 'newest_first',
                total_cards: (opts.cards || []).length,
                description: 'Utilizador ordenou a lista por Mais Recentes Primeiro'
              });
              var sortedCards = opts.cards.sort(function (a, b) {
                var tA = parseInt(a.id.substring(0, 8), 16);
                var tB = parseInt(b.id.substring(0, 8), 16);
                return tB - tA;
              });
              return {
                sortedCardIds: sortedCards.map(function (c) { return c.id; })
              };
            }
          }];
        });
      }

    }, {
      appName: 'KPI Master',
      appKey: import.meta.env.VITE_TRELLO_API_KEY
    });
  </script>
</body>

</html>
